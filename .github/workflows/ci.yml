name: Vérifier

on:
  push:
    branches: [main]
  pull_request:

jobs:
  overlay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Compiler l'overlay (cible Windows depuis Linux)
        run: dotnet build apps/PilouBureau -c Release -p:EnableWindowsTargeting=true
      - name: Variante « lecteur de notifications » (identité de package, docs/NOTIFICATIONS.md)
        run: dotnet build apps/PilouBureau -c Release -p:EnableWindowsTargeting=true -p:IdentitePackage=true
      - name: installer.ps1 sans BOM (sinon « irm … | iex » casse)
        run: "! head -c 3 installer.ps1 | od -An -tx1 | grep -q 'ef bb bf'"
      - name: Tests (états, bulle, signaux, branchement Codex)
        run: dotnet test apps/PilouBureau/tests
      - name: Exécutable autonome pour Windows (à essayer sans release)
        run: >
          dotnet publish apps/PilouBureau -c Release -r win-x64 --self-contained -p:EnableWindowsTargeting=true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -o out
      - run: cd out && zip -q ../PilouBureau.zip *
      - uses: actions/upload-artifact@v4
        with:
          name: PilouBureau-windows
          path: |
            PilouBureau.zip
            installer.ps1

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests (chiffrement commun avec le PC, état) et APK
        run: ./gradlew --no-daemon testReleaseUnitTest assembleRelease
      - name: Captures d'écran de l'app (revue d'interface)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures-ui
          path: android/app/build/captures/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: Pilou-apk
          path: android/app/build/outputs/apk/release/app-release.apk

  vscode:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extension VS Code (compilation, tests, .vsix)
        run: |
          npm ci
          npm run compile
          npm test
          npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: pilou-vscode
          path: integrations/vscode/pilou-vscode.vsix

  visualstudio:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Extension Visual Studio (.vsix, MSBuild + Microsoft.VSSDK.BuildTools)
        run: msbuild integrations/visualstudio/PilouVisualStudio.csproj -restore -p:Configuration=Release -v:minimal -nologo
      - uses: actions/upload-artifact@v4
        with:
          name: PilouVisualStudio
          path: integrations/visualstudio/bin/Release/PilouVisualStudio.vsix
          if-no-files-found: error
