name: Vérifier

on:
  push:
    branches: [main]
  pull_request:

jobs:
  overlay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Compiler l'overlay (cible Windows depuis Linux)
        run: dotnet build apps/PilouBureau -c Release -p:EnableWindowsTargeting=true
      - name: Tests (états, bulle, signaux, branchement Codex)
        run: dotnet test apps/PilouBureau/tests

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests (chiffrement commun avec le PC, état) et APK
        run: ./gradlew --no-daemon testReleaseUnitTest assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Pilou-apk
          path: android/app/build/outputs/apk/release/app-release.apk
