plugins {
    id 'com.android.application'
}

// App sans aucune bibliothèque : le framework Android suffit (notification, widget, fenêtre flottante).
android {
    namespace 'fr.pilou.compagnon'
    compileSdk 35

    defaultConfig {
        applicationId 'fr.pilou.compagnon'
        minSdk 26
        targetSdk 35
        // La release fixe les deux (minutes depuis 2025 : toujours croissant) ; en local, on les calcule pareil.
        versionCode((System.getenv('PILOU_VERSION_CODE') ?: ((System.currentTimeMillis().intdiv(1000) - 1735689600).intdiv(60)).toString()).toInteger())
        versionName(System.getenv('PILOU_VERSION') ?: '0.9-dev')
    }

    // Clé de signature publique du dépôt (app installée à la main, hors Play Store) : chaque version
    // s'installe par-dessus la précédente. PILOU_KEYSTORE remplace la clé par une clé privée.
    signingConfigs {
        pilou {
            storeFile file(System.getenv('PILOU_KEYSTORE') ?: 'pilou.keystore')
            storePassword System.getenv('PILOU_KEYSTORE_PASS') ?: 'pilou-public'
            keyAlias 'pilou'
            keyPassword System.getenv('PILOU_KEYSTORE_PASS') ?: 'pilou-public'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.pilou
        }
        debug {
            signingConfig signingConfigs.pilou
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            // Robolectric : le framework Android qu'il simule est résolu par Gradle (mis en cache par la CI)
            // au lieu d'être téléchargé à chaque test depuis Maven Central (qui répond parfois 429).
            all {
                dependsOn 'preparerRobolectric'
                systemProperty 'robolectric.offline', 'true'
                systemProperty 'robolectric.dependency.dir', layout.buildDirectory.dir('robolectric').get().asFile.absolutePath
                testLogging {
                    events 'failed'
                    exceptionFormat 'full'
                    showStackTraces true
                    showCauses true
                }
            }
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

// Une configuration par version : dans une même configuration, Gradle ne garderait que la plus récente.
configurations {
    robolectric14 { transitive = false }
    robolectric15 { transitive = false }
}

tasks.register('preparerRobolectric', Copy) {
    from configurations.robolectric14
    from configurations.robolectric15
    into layout.buildDirectory.dir('robolectric')
}

dependencies {
    // Versions qu'attend Robolectric 4.14.1 (sdk 34 de robolectric.properties, et 35, la cible de l'app).
    robolectric14 'org.robolectric:android-all-instrumented:14-robolectric-10818077-i7'
    robolectric15 'org.robolectric:android-all-instrumented:15-robolectric-12650502-i7'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
